========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#020711;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}


/* =========================
   HEADER
========================= */

header{

    height:165px;

    position:relative;

    overflow:hidden;

    border-bottom:
        1px solid #123d65;

    background:#030b18;
}

header .banner{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    opacity:.55;
}

header::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            90deg,
            #020813 0%,
            rgba(2,8,19,.9) 32%,
            rgba(2,8,19,.25) 75%,
            transparent
        );
}
